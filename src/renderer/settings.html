<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設定 — 桌面 AI 伴侶</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #14161f; color: #e8eaf2; font: 14px/1.6 system-ui, "Microsoft JhengHei", sans-serif; }
      #app { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      section { background: #1d2130; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
      h2 { font-size: 15px; margin: 0 0 10px; color: #9db8ff; }
      label { display: block; margin: 8px 0 2px; color: #aab; font-size: 12px; }
      input[type=text], input[type=number], select, textarea { width: 100%; box-sizing: border-box; background: #10131d; color: #fff; border: 1px solid #343a52; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
      input[type=checkbox] { transform: scale(1.2); }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      button { background: #3a5bff; color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
      button.ghost { background: #2a2f45; }
      button.danger { background: #a33; }
      button:disabled { opacity: .5; cursor: default; }
      .hint { font-size: 12px; color: #8a90a8; margin-top: 4px; }
      .warn { color: #ffb454; } .ok { color: #7ddf9a; } .err { color: #ff7b7b; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      td, th { border-bottom: 1px solid #2a2f45; padding: 6px 4px; text-align: left; vertical-align: top; }
      .mem-input { width: 100%; }
      progress { width: 100%; }
    </style>
  </head>
  <body>
    <div id="app"><h1>設定</h1><p>讀取中…</p></div>
    <script type="module" src="./src/settings/settings-ui.ts"></script>
  </body>
</html>
