appId: com.example.desktop-ai-companion
productName: 桌面 AI 伴侶
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - assets/tray.png
  - assets/icon.png
# sidecar 需以實體檔案存在（python 直讀），不進 asar
extraResources:
  - from: sidecar
    to: sidecar
  - from: assets
    to: assets
# better-sqlite3 的 .node 二進位不進 asar（需驗證：目標機 Electron ABI 重編）
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - nsis
  signAndEditExecutable: false
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 桌面 AI 伴侶
